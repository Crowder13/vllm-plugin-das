name: Patch coverage

on:
  push:
    branches:
      - v0.25.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-patch-gate:
    runs-on:
      - self-hosted
      - hcu-linux-cpu
    steps:
      - uses: actions/checkout@v4
      - name: Verify every patch has a contract and test reference
        run: python tools/check_patch_test_coverage.py
      - name: Compile test and patch tooling
        run: python -m compileall -q tools tests
