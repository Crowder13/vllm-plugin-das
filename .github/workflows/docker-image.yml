name: docker-image

on:
  workflow_dispatch:
    inputs:
      push:
        description: 构建完成后推送到 Harbor
        type: boolean
        default: true
      no_cache:
        description: 不使用 Docker 构建缓存
        type: boolean
        default: false
      vllm_version:
        description: vLLM 版本
        type: string
        default: "0.25.1"
      torch_version:
        description: PyTorch 版本 (das 加速库按此 tag 匹配)
        type: string
        default: "2.11.0"

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: false

env:
  HARBOR_SITE: 10.16.1.152:5000
  HARBOR_NAMESPACE: jenkins/model_test_env

jobs:
  build:
    # 需要能访问内网 pip 源 / AICC 下载地址 / Harbor 的自托管构建节点
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 获取最新 AICC
        run: |
          AICC_URL="http://42.228.13.241:18000/ai_cc/nightly/"
          LATEST_AICC=$(curl -s "${AICC_URL}" | grep -oP 'dtk_llvm_[^"]+\.run' | sed 's/\.run$//' | sort -t '_' -k4 -nr | head -n1)
          if [ -z "${LATEST_AICC}" ]; then
            echo "无法从 ${AICC_URL} 解析出最新 AICC nightly"
            exit 1
          fi
          echo "AICC_URL=${AICC_URL}${LATEST_AICC}.run" >> "$GITHUB_ENV"
          echo "AICC_VERSION=${LATEST_AICC#dtk_llvm_}" >> "$GITHUB_ENV"

      - name: 生成镜像 tag
        run: |
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          BASE_VERSION=$(grep -oP '__version__ = "\K[^"]+' vllm_hcu/version.py)
          echo "IMAGE_TAG=vllm-plugin-das:${BASE_VERSION}-ubuntu22.04-dtk2604-py3.10-${BUILD_TIME}" >> "$GITHUB_ENV"

      - name: 登录 Harbor
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_SITE }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          no-cache: ${{ inputs.no_cache }}
          tags: ${{ env.HARBOR_SITE }}/${{ env.HARBOR_NAMESPACE }}/${{ env.IMAGE_TAG }}
          network: host
          build-args: |
            AICC_URL=${{ env.AICC_URL }}
            AICC_VERSION=${{ env.AICC_VERSION }}
            VLLM_VERSION=${{ inputs.vllm_version }}
            TORCH_VERSION=${{ inputs.torch_version }}

      - name: 拉回镜像 (推送后从 Harbor 校验)
        if: inputs.push
        run: docker pull ${{ env.HARBOR_SITE }}/${{ env.HARBOR_NAMESPACE }}/${{ env.IMAGE_TAG }}

      - name: 冒烟测试
        env:
          FULL_TAG: ${{ env.HARBOR_SITE }}/${{ env.HARBOR_NAMESPACE }}/${{ env.IMAGE_TAG }}
        run: |
          docker run --rm "$FULL_TAG" bash -c \
            "source /opt/dtk/env.sh && python -c 'import vllm, vllm_hcu; print(vllm_hcu.__hcu_version__)'"
