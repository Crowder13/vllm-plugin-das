[pytest]
markers =
    hcu: requires a live HCU/ROCm runtime or compiled HCU extensions
    model: loads a real model checkpoint
    multi_hcu: requires two or more HCU devices on one node
    hcu_count(count): declares the number of HCU devices required on one node
    multi_node: requires two or more physical compute nodes
    node_count(count): declares the number of physical nodes required
    external_service(name): requires an external service such as Mooncake
    slow: exceeds the pull-request fast-test time budget
    nightly: belongs to the scheduled nightly hardware suite
    isolated_process: must execute its runtime assertions in a clean subprocess
    reuse_model: permits reuse of an identical, explicitly reset model instance
